<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img" aria-labelledby="title desc">
<title id="title">一份依据怎样进入回答</title><desc id="desc">教学示意。问题进入程序，程序请求模型，工具结果回填消息，再请求模型。模型提议，程序执行，任务结果另行核验。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#27685c"/></marker></defs>
<rect width="520" height="650" rx="16" fill="#f4f7f5"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#173c38">
<text x="32" y="43" font-size="24" font-weight="700">一份依据怎样进入回答</text><text x="32" y="73" font-size="16">静态机制示意 · 不是模型实测</text>
<g fill="white" stroke="#8bafa5" stroke-width="2"><rect x="32" y="99" width="456" height="90" rx="10"/><rect x="32" y="229" width="456" height="90" rx="10"/><rect x="32" y="359" width="456" height="104" rx="10"/><rect x="32" y="503" width="456" height="90" rx="10"/></g>
<g stroke="#27685c" stroke-width="2.5" marker-end="url(#arrow)"><path d="M260 189V224"/><path d="M260 319V354"/><path d="M260 463V498"/></g>
<text x="52" y="133" font-size="22" font-weight="700">1  页面 → 本地服务</text><text x="52" y="165" font-size="18">任务：怎样运行测试？依据是什么？</text>
<text x="52" y="263" font-size="22" font-weight="700">2  程序 → 提供商</text><text x="52" y="295" font-size="18">发送 messages 与允许的工具说明</text>
<text x="52" y="393" font-size="22" font-weight="700">3  程序检查并执行 read_doc</text><text x="52" y="423" font-size="18">读取 testing，得到 npm test</text><text x="52" y="449" font-size="18">把结果加入 messages，用 ID 关联</text>
<text x="52" y="537" font-size="22" font-weight="700">4  再次请求 → 得到回答</text><text x="52" y="569" font-size="18">回答仍需和本次来源、实际结果核对</text>
<text x="32" y="626" font-size="17">模型提议 ≠ 程序执行 ≠ 任务完成</text></g></svg>
